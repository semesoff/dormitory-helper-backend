services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dormitory_helper
      POSTGRES_USER: dormitory
      POSTGRES_PASSWORD: dormitory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dormitory -d dormitory_helper"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dormitory:dormitory@postgres:5432/dormitory_helper?sslmode=disable
      JWT_SECRET: super-secret-dev-key
      MIGRATIONS_PATH: /app/migrations
      HTTP_ADDR: :8081
    command: ["api"]
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dormitory:dormitory@postgres:5432/dormitory_helper?sslmode=disable
      JWT_SECRET: super-secret-dev-key
      MIGRATIONS_PATH: /app/migrations
      WORKER_INTERVAL: 10s
    command: ["worker"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep worker >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
